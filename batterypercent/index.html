<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Percent Battery</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Percent Battery">
<meta name="theme-color" content="#2E7D32">

<style>
* { box-sizing:border-box; }

html,body{height:100%;}
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f2f2f7;
    min-height:100vh;
}

/* Make the "card" take up the full viewport instead of floating */
.card{
    width:100%;
    height:100vh;
    max-width:100%;
    background:white;
    border-radius:0;
    padding:28px;
    box-shadow:none;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

h1{
    margin:0;
    text-align:center;
    font-size:32px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin:8px 0 24px;
}

input{
    width:90%;
    max-width:420px;
    font-size:28px;
    text-align:center;
    padding:12px;
    border-radius:12px;
    border:2px solid #ddd;
    outline:none;
}

input:focus{
    border-color:#2E7D32;
}

.percent{
    margin-top:22px;
    text-align:center;
    font-size:64px;
    font-weight:700;
}

.status{
    text-align:center;
    color:#666;
    margin-top:8px;
    font-size:18px;
}

.battery{
    width:260px;
    height:90px;
    border:5px solid #444;
    border-radius:14px;
    margin:22px auto 12px;
    position:relative;
    padding:6px;
}

.battery::after{
    content:"";
    position:absolute;
    right:-15px;
    top:25px;
    width:10px;
    height:30px;
    background:#444;
    border-radius:3px;
}

.level{
    height:100%;
    width:0%;
    background:#2E7D32;
    border-radius:7px;
    transition:all .35s ease;
}

details{
    margin-top:24px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:8px;
    text-align:center;
    border-bottom:1px solid #eee;
}

.footer{
    text-align:center;
    color:#888;
    margin-top:20px;
    font-size:13px;
}

@media (min-width:900px){
  .percent{font-size:80px}
  input{font-size:32px}
}
</style>
</head>

<body>

<div class="card">

<h1>🔋 Percent Battery</h1>
<div class="subtitle">LiFePO₄ Battery Calculator</div>

<input
id="voltage"
type="number"
step="0.01"
placeholder="Enter Voltage"
inputmode="decimal">

<div class="battery">
    <div id="level" class="level"></div>
</div>

<div class="percent" id="percent">--%</div>
<div class="status" id="status">Waiting for voltage...</div>

<details>
<summary>Voltage Reference</summary>

<table>
<tr><th>Voltage</th><th>Percent</th></tr>
<tr><td>13.6</td><td>100%</td></tr>
<tr><td>13.4</td><td>90%</td></tr>
<tr><td>13.3</td><td>80%</td></tr>
<tr><td>13.2</td><td>70%</td></tr>
<tr><td>13.1</td><td>60%</td></tr>
<tr><td>13.0</td><td>50%</td></tr>
<tr><td>12.9</td><td>30%</td></tr>
<tr><td>12.8</td><td>20%</td></tr>
<tr><td>12.0</td><td>10%</td></tr>
<tr><td>10.0</td><td>0%</td></tr>
</table>

</details>

<div class="footer">
Works offline • Add to Home Screen in Safari
</div>

</div>

<script>

const table=[
{v:13.6,p:100},
{v:13.4,p:90},
{v:13.3,p:80},
{v:13.2,p:70},
{v:13.1,p:60},
{v:13.0,p:50},
{v:12.9,p:30},
{v:12.8,p:20},
{v:12.0,p:10},
{v:10.0,p:0}
];

const input=document.getElementById("voltage");

input.addEventListener("input",calculate);

function calculate(){

const v=parseFloat(input.value);

if(isNaN(v)){
update(null);
return;
}

if(v>=table[0].v){
update(100);
return;
}

if(v<=table[table.length-1].v){
update(0);
return;
}

for(let i=0;i<table.length-1;i++){

const hi=table[i];
const lo=table[i+1];

if(v<=hi.v && v>=lo.v){

const ratio=(v-lo.v)/(hi.v-lo.v);
const p=lo.p+(hi.p-lo.p)*ratio;

update(Math.round(p));
return;

}

}

}

function update(percent){

const display=document.getElementById("percent");
const bar=document.getElementById("level");
const status=document.getElementById("status");

if(percent===null){
display.innerHTML="--%";
bar.style.width="0%";
status.innerHTML="Waiting for voltage...";
return;
}

display.innerHTML=percent+"%";
bar.style.width=percent+"%";

let color="#2E7D32";
let text="Excellent";

if(percent<50){
color="#F9A825";
text="Moderate";
}

if(percent<20){
color="#D32F2F";
text="Low";
}

bar.style.background=color;
display.style.color=color;
status.innerHTML=text;

}

</script>

</body>
</html>
